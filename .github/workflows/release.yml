name: Release Windows amd64

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test source
        run: go test .

      - name: Create release package
        shell: pwsh
        run: |
          $packageDir = 'Releases/yx_windows_amd64'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          go build -trimpath -ldflags '-s -w' -o "$packageDir/yx_windows_amd64.exe" .
          Copy-Item ip.txt, ipv6.txt, README.md, LICENSE -Destination $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath 'Releases/yx_windows_amd64.zip' -Force

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: Automatically built from the latest master commit.
          prerelease: false
          make_latest: true
          files: Releases/yx_windows_amd64.zip
