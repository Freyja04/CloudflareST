name: Release Windows amd64

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'

      - name: Test source
        run: go test .

      - name: Create release package
        shell: pwsh
        run: |
          $packageDir = 'Releases/yx_windows_amd64'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          go build -trimpath -ldflags '-s -w' -o "$packageDir/yx_windows_amd64.exe" .
          Copy-Item ip.txt, ipv6.txt, README.md, LICENSE -Destination $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath 'Releases/yx_windows_amd64.zip' -Force

      - name: Publish latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest
          body: Automatically built from the latest master commit.
          prerelease: false
          make_latest: true
          files: Releases/yx_windows_amd64.zip
